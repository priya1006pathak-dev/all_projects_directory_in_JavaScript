<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Light Theme Toggle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>LIGHT DARK THEME TOGGLE</h1>
    <p>using HTML CSS & JAVASCRIPT</p>

    <div class="theme-box">

        <div class="light-side">
            <img class="icon" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/2600.svg" alt="Sun">
            <h2>Light</h2>
        </div>

        <div class="dark-side">
            <img class="icon" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f319.svg" alt="Moon">
            <h2 id="result">Dark</h2>
        </div>

    </div>
    <button id="toggleBtn">Toggle Theme</button>
    <script src="script.js"></script>
</body>

</html>
